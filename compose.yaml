name: vllm-deploy
services:
  vllm:
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    volumes:
      - ${PWD}/.cache/:/root/.cache/
    ports:
      - 8791:8000
    env_file:
      - path: ${PWD}/vllm/.env
    image: vllm/vllm-openai:v0.20.1
    command: >
      Qwen/Qwen3.5-0.8B
      --max-model-len 16384
      --max_num_batched_tokens 128
      --max-num-seqs 1
      --gpu-memory-utilization 0.8
      --no-enable-prefix-caching
      --trust-remote-code
      --limit-mm-per-prompt '{"image":1, "video": 0, "audio": 0}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 10
  prometheus:
    ports:
      - 8808:9090
    volumes:
      - ${PWD}/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    image: prom/prometheus
    depends_on:
      vllm:
        condition: service_healthy
  grafana:
    ports:
      - 8809:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ${PWD}/grafana.ini:/etc/grafana/grafana.ini
      - ${PWD}/grafana-provisioning/:/etc/grafana/provisioning/
    image: grafana/grafana-enterprise
    depends_on:
      vllm:
        condition: service_healthy
volumes:
  prometheus-data:
    external: true
    name: prometheus-data
  grafana-storage:
    external: true
    name: grafana-storage
