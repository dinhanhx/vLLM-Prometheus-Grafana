apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vllm-deploy
data:
  prometheus.yml: |
    # prometheus.yaml
    global:
      scrape_interval: 5s
      evaluation_interval: 30s

    scrape_configs:
    - job_name: vllm
      static_configs:
      - targets:
        - 'vllm:8000'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ini
  namespace: vllm-deploy
data:
  grafana.ini: |
    [security]
    admin_user = admin
    admin_password = 12345678

    [users]
    allow_sign_up = false

    [auth]
    disable_login_form = false

    [paths]
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
